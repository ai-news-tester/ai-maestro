name: Bug Report
description: Report an issue, crash, or unexpected behavior in AI-Maestro.
title: '[BUG]: '
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and resolve the problem quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps in the UI.
      placeholder: |
        1. Open the studio and load a WAV file (or use the built-in demo)
        2. Press AUTO MASTER / turn a named knob / press Export
        3. Encounter error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Details about your environment.
      value: |
        - Browser: [e.g. Chrome 131 / Firefox 133 / Safari 18]
        - OS: [e.g. Windows 11 / macOS 14 / Ubuntu 24.04]
        - AI-Maestro Version: [e.g. 1.0.0]
        - Audio file: [format, duration, sample rate, if relevant]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Console Output
      description: Copy any browser console errors if available.
      render: shell
