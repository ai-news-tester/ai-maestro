name: Feature Request
description: Propose a new feature, algorithm, or enhancement for AI-Maestro.
title: '[FEAT]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new DSP stages, analysis metrics, performance optimizations, and UI improvements.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or use case?
      placeholder: When mastering a track, the current controls...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Detailed explanation of the proposed behavior or algorithm. Note that any new DSP stage must go into the shared buildMasterChain so live playback and export stay identical.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Any alternative designs or workarounds you have explored.
  - type: checkboxes
    id: contribution
    attributes:
      label: Implementation
      options:
        - label: I am willing to submit a Pull Request to implement this feature.
