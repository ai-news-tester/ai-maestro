name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Documentation & Registry Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Knob Registry JSON
        run: |
          python3 -c "import json; json.load(open('docs/knob-registry.json'))"
          echo "Knob registry JSON valid!"

      - name: Verify Documentation & Public Assets
        run: |
          test -f docs/index.html
          test -f docs/sitemap.xml
          test -f README.md
          echo "Documentation and public assets verified!"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suites
        run: |
          node bug-repro.mjs
          node auto-repro.mjs
          node deshimmer-repro.mjs
          node dom-contract.mjs
          node link-check.mjs